[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpuft-research-framework"
version = "1.0.1"
description = "Reproducible V-PUFT framework for centralized, distributed RSU, and Ahmed-inspired VANET architectures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research use"}
authors = [{name = "V-PUFT Research Project"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "cryptography>=41"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "coverage>=7"]
sumo = ["traci>=1.20", "sumolib>=1.20"]
all = ["pytest>=7.4", "coverage>=7", "traci>=1.20", "sumolib>=1.20"]

[project.scripts]
vpuft = "vpuft.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "sumo: requires a local SUMO installation and TraCI",
  "slow: longer statistical tests"
]
